<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0b08" />
    <title>Banner &amp; Blade</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #0d0b08;
        position: fixed; inset: 0;
        overscroll-behavior: none; /* no pull-to-refresh / rubber-banding */
      }
      body {
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none; /* the game owns every gesture */
        color: #f3e9d2;
      }
      #app { position: fixed; inset: 0; touch-action: none; }
      canvas { display: block; image-rendering: optimizeQuality; touch-action: none; }
      #app canvas { position: absolute; inset: 0; }
      .nocursor { cursor: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
