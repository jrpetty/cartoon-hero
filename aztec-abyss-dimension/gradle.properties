# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
# neo_version matched to a known-good working build (the compiled "hunter" mod
# targets 21.1.234), so this project builds against a proven NeoForge release.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.234
neo_version_range=[21.1.0,)
loader_version_range=[1,)

## Mod Properties
mod_id=aztecabyss
mod_name=Aztec Abyss
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.jrpetty.aztecabyss
mod_authors=jrpetty
mod_description=A dark, self-contained dimension reached through a black-flamed portal: a bounded arena built around an Aztec step-pyramid, defended in a Call of Duty Zombies-style round survival mode that scales to Round 20.
