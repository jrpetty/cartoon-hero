org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# ---- Mod metadata ----
mod_id=voxelia_mmo
mod_name=Voxelia MMO
mod_version=0.1.0
mod_group_id=com.voxelia.mmo
mod_authors=Voxelia
mod_description=An MMO progression layer for Minecraft: per-skill XP and levels (Mining, Foraging, Combat, Farming), level-up stat scaling, a skills HUD, a quest/advancement chain, and commands.
mod_license=MIT

# ---- Toolchain / platform versions ----
# Minecraft + NeoForge target. Bump these together to retarget the mod.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.172
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment human-readable mappings (optional, improves param names in dev)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
