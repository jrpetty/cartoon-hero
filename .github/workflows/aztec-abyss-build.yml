name: Build Aztec Abyss jar

# Builds the NeoForge mod in aztec-abyss-dimension/ on GitHub's runners (which
# have full internet access to the NeoForge/Mojang maven repos this dev sandbox
# cannot reach), uploads the jar as a downloadable artifact, AND commits the
# built jar to dist/ so it can be pulled via git.
on:
  push:
    paths:
      - 'aztec-abyss-dimension/**'
      - '.github/workflows/aztec-abyss-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aztec-abyss-dimension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: aztecabyss-jar
          path: aztec-abyss-dimension/build/libs/*.jar
          if-no-files-found: error

      - name: Commit built jar to dist/
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist
          cp aztec-abyss-dimension/build/libs/*.jar dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.jar
          git commit -m "Publish built Aztec Abyss jar [skip ci]" || echo "no changes"
          git push origin HEAD:${{ github.ref_name }}
