name: Build Aztec Abyss jar

# Builds the NeoForge mod in aztec-abyss-dimension/ on GitHub's runners (which
# have full internet access to the NeoForge/Mojang maven repos this dev sandbox
# cannot reach), uploads the jar as a downloadable artifact, AND commits the
# built jar to dist/ so it can be pulled via git.
on:
  push:
    paths:
      - 'aztec-abyss-dimension/**'
      - '.github/workflows/aztec-abyss-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aztec-abyss-dimension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        # Retried because the Gradle wrapper's distribution download from
        # services.gradle.org occasionally dies mid-transfer on hosted
        # runners; a real compile failure still fails after the retries.
        run: |
          for attempt in 1 2 3 4; do
            ./gradlew build --no-daemon --stacktrace && exit 0
            echo "build attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Boot a server and run the smoke tests
        # The jar has compiled; now something has to actually run it before a
        # player does. NeoForge's game-test server starts a headless dedicated
        # server with the mod installed, runs the @GameTest methods in
        # com.jrpetty.aztecabyss.gametest, and exits non-zero on any failure.
        # A boot that throws fails the same way. Nothing below this step runs
        # unless it passes, so a broken build can never become the dist jar.
        shell: bash
        run: |
          set -o pipefail
          timeout 25m ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log

      - name: Fail on any exception that passed through mod code
        # The game-test server exits 0 if every test passed, but an exception
        # logged and swallowed somewhere in a tick is exactly the kind of thing
        # a live server suffers and a green test misses. Any stack frame of
        # ours in the boot log is a failure.
        shell: bash
        run: |
          if grep -nE '^\s+at com\.jrpetty\.aztecabyss' gametest.log; then
            echo "::error::mod code appears in a stack trace during the smoke run"
            exit 1
          fi
          if grep -nE 'ERROR\]?[^\n]*aztecabyss' gametest.log | grep -v 'GameTest' ; then
            echo "::error::the mod logged at ERROR during the smoke run"
            exit 1
          fi
          echo "smoke run clean"

      - name: Keep the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-log
          path: aztec-abyss-dimension/gametest.log
          if-no-files-found: ignore

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: aztecabyss-jar
          path: aztec-abyss-dimension/build/libs/*.jar
          if-no-files-found: error

      - name: Commit built jar to dist/
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist
          cp aztec-abyss-dimension/build/libs/*.jar dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.jar
          git commit -m "Publish built Aztec Abyss jar [skip ci]" || echo "no changes"
          git push origin HEAD:${{ github.ref_name }}

  # The tour: the real game client, under a virtual display with software
  # OpenGL, plays the mod start to finish (see client/tour/ClientTour) and
  # screenshots every stage. It runs after the jar is built and published, on
  # commits whose message carries a [tour:<label>] tag (or by hand), and commits
  # its pictures and report to tour/<label>/ on the same branch.
  tour:
    needs: build
    if: contains(github.event.head_commit.message, '[tour') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aztec-abyss-dimension
    steps:
      - name: Checkout the branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils imagemagick > /dev/null
          chmod +x ./gradlew

      - name: Pre-seed client options
        # Fixed window, GUI scale 3 (what most 1080p players run), no sound,
        # no onboarding screens, and never pause on lost focus - a virtual
        # display has no focus, and a paused singleplayer game stops its server.
        run: |
          mkdir -p run/tour
          cat > run/tour/options.txt << 'OPTS'
          version:3955
          guiScale:3
          renderDistance:6
          simulationDistance:6
          graphicsMode:1
          maxFps:60
          gamma:1.0
          pauseOnLostFocus:false
          onboardAccessibility:false
          tutorialStep:none
          joinedFirstServer:true
          skipMultiplayerWarning:true
          narrator:0
          soundCategory_master:0.0
          fullscreen:false
          OPTS
          sed -i 's/^ *//' run/tour/options.txt

      - name: Play the tour
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" timeout 45m ./gradlew runTour --no-daemon 2>&1 | tee tour.log
          echo "${PIPESTATUS[0]}" > tour.exit
          exit 0

      - name: Publish the pictures to tour/<label>/
        env:
          MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          label=$(printf '%s' "$MSG" | grep -o '\[tour:[a-z0-9_-]*\]' | head -1 | sed 's/\[tour:\(.*\)\]/\1/')
          label=${label:-latest}
          out="../tour/$label"
          rm -rf "$out" && mkdir -p "$out"
          if ls run/tour/screenshots/*.png > /dev/null 2>&1; then
            for f in run/tour/screenshots/*.png; do
              convert "$f" -quality 90 "$out/$(basename "${f%.png}").jpg"
            done
          fi
          cp run/tour/tour-report.txt "$out/" 2>/dev/null || echo "no report was written" > "$out/tour-report.txt"
          grep -E '\[TOUR\]|Exception|at com\.jrpetty\.aztecabyss' tour.log | head -400 > "$out/tour-log-excerpt.txt" || true
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "tour/$label"
          git commit -m "Tour screenshots: $label [skip ci]" || echo "no changes"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:${{ github.ref_name }} && break
            sleep $((attempt * 5))
          done

      - name: Fail on a broken tour
        shell: bash
        run: |
          code=$(cat tour.exit 2>/dev/null || echo 1)
          echo "client exit code: $code"
          grep '\[TOUR\] RESULT' tour.log || { echo "::error::the tour never reported a result"; exit 1; }
          if grep -q '\[TOUR\] RESULT: [0-9]* passed, [1-9]' tour.log; then
            echo "::error::tour steps failed"; grep 'FAIL ' tour.log | head -40; exit 1
          fi
          if grep -nE '^\s+at com\.jrpetty\.aztecabyss' tour.log | grep -v 'client.tour.ClientTour' | head -20 | grep -q .; then
            echo "::error::mod code appears in a stack trace during the tour"
            grep -nE -B8 '^\s+at com\.jrpetty\.aztecabyss' tour.log | head -120
            exit 1
          fi
          [ "$code" = "0" ] || { echo "::error::client exited with $code"; exit 1; }
          echo "tour clean"
