name: Build Mods

on:
  push:
    branches:
      - claude/minecraft-best-mods-7td78r
    paths:
      - "minecraft-mod/**"
      - "desire-paths/**"
      - "grappling-hook/**"
      - "succession/**"
      - "gadgets/**"
      - ".github/workflows/build-mods.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod:
          - minecraft-mod
          - desire-paths
          - grappling-hook
          - succession
          - gadgets
    name: Build ${{ matrix.mod }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        working-directory: ${{ matrix.mod }}
        run: chmod +x ./gradlew

      - name: Build
        working-directory: ${{ matrix.mod }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: |
            ${{ matrix.mod }}/build/libs/*.jar
            !${{ matrix.mod }}/build/libs/*-sources.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Publish jars to a release
    steps:
      - name: Download all built jars
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect jars
        run: |
          mkdir -p release
          find artifacts -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;
          ls -l release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mods-latest
          name: Minecraft Mods (latest build)
          body: |
            Built automatically from the latest commit on the development branch.
            Drop a jar into your `.minecraft/mods` folder (Minecraft 1.21.1, Fabric Loader + Fabric API).
          files: release/*.jar
          fail_on_unmatched_files: true
