name: Build Automata mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the mod
        working-directory: minecraft/mods/automata
        run: ./gradlew --no-daemon build --stacktrace

      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: automata-mod
          path: minecraft/mods/automata/build/libs/*.jar
          if-no-files-found: error

      # Publish the jar to a permanent Release page so it can be downloaded
      # directly (no Actions-artifact digging, no expiry). Updates the same
      # rolling "automata-latest" tag on every push to the dev branch.
      - name: Publish jar to a GitHub Release
        if: github.ref == 'refs/heads/claude/minecraft-claude-mods-server-oyne7q'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: automata-latest
          name: Automata (latest build)
          body: >
            Automata — a Fabric 1.21.1 mod. Requires Fabric Loader and
            Fabric API 0.105.0+1.21.1. Drop this jar (plus Fabric API) into
            your mods/ folder. Built from commit ${{ github.sha }}.
          files: minecraft/mods/automata/build/libs/*.jar
