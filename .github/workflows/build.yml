name: Build Automata mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the mod
        working-directory: minecraft/mods/automata
        run: ./gradlew --no-daemon build --stacktrace

      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: automata-mod
          path: minecraft/mods/automata/build/libs/*.jar
          if-no-files-found: error
