name: Build Mob Trumps mod

on:
  push:
    branches:
      - claude/minecraft-card-battle-system-xmu0iu
      - master
    paths:
      - 'mod/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Compiles the mod and runs the game-rule tests. `build` depends on
      # `test`, so a broken rule fails here and never reaches a release.
      # A skipped popPose() corrupts every later draw in the frame, which shows
      # up as huge misplaced geometry rather than as a missing element.
      - name: Check matrix-stack balance
        working-directory: mod
        run: python3 tools/checkpose.py src/main/java

      - name: Build mod jar and run tests
        working-directory: mod
        run: ./gradlew --no-daemon build

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: mod/build/reports/tests/test
          if-no-files-found: ignore

      # Checks that only make sense against the packaged artifact: that no
      # client-only class can reach a dedicated server, and that every model,
      # texture and override actually resolves. Both are silent failures in
      # game -- a crash on boot for one, the wrong card art for the other --
      # so they gate the release rather than just reporting.
      - name: Verify the packaged jar
        working-directory: mod
        run: |
          JAR=$(ls build/libs/mobtrumps-*.jar | grep -v sources | head -1)
          echo "Verifying $JAR"
          python3 tools/checkdist.py "$JAR"
          python3 tools/checkassets.py "$JAR" .

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobtrumps-jar
          path: mod/build/libs/*.jar

      - name: Publish jar as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=mob-trumps-latest
          gh release delete "$TAG" --yes || true
          git push origin ":refs/tags/$TAG" || true
          gh release create "$TAG" mod/build/libs/mobtrumps-*.jar \
            --target "$GITHUB_SHA" \
            --title "Mob Trumps mod (latest build)" \
            --notes "NeoForge 21.1.x / Minecraft 1.21.1. Download the jar below and drop it into your mods/ folder."
