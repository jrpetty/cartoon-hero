name: Build NeoForge mod

# Builds the Voxelia MMO NeoForge mod into a .jar on GitHub's runners, which
# (unlike the authoring sandbox) can reach the NeoForge + Mojang Maven repos.
# The resulting jar is uploaded as a downloadable build artifact.

on:
  push:
    paths:
      - 'mc-mod/**'
      - '.github/workflows/build-mod.yml'
  pull_request:
    paths:
      - 'mc-mod/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: mc-mod

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
        working-directory: mc-mod

      - name: Upload mod jar (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: voxelia-mmo-jar
          path: mc-mod/build/libs/*.jar
          if-no-files-found: error

      # Publish the jar to a rolling pre-release so it has a permanent,
      # login-free download link: /releases/tag/voxelia-mod-latest
      - name: Publish to release
        if: github.ref == 'refs/heads/claude/minecraft-mmo-research-1fgn7x'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voxelia-mod-latest
          name: Voxelia MMO (latest build)
          prerelease: true
          body: >
            Automated build of the Voxelia MMO NeoForge mod
            (Minecraft 1.21.1 / NeoForge 21.1). Drop the jar into your
            instance's mods/ folder.
          files: mc-mod/build/libs/*.jar
