# Render Blueprint for Echo (alternative to Fly.io).
# Note: the persistent disk requires a paid instance (Starter, ~$7/mo).
# In the Render dashboard: New → Blueprint → pick this repo.
services:
  - type: web
    name: echo
    runtime: python
    rootDir: echo
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ECHO_PASSWORD
        sync: false
      - key: ECHO_DB_PATH
        value: /var/data/echo.db
    disk:
      name: echo-data
      mountPath: /var/data
      sizeGB: 1
