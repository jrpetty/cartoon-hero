<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mob Trumps — Minecraft Card Battle</title>
<style>
  :root {
    --grass: #5b8731; --grass-light: #7bb544; --dirt: #79553a; --dirt-dark: #5a3d28;
    --stone: #828282; --ink: #1b1b1b; --paper: #d7ccc8; --gold: #fcdc5f;
    --hp: #e05d5d; --atk: #e09a3c; --siz: #8d6fd1; --spd: #55b7d4; --frm: #6fbf5e; --rar: #d46fb3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #2e2417;
    background-image: linear-gradient(rgba(0,0,0,.25) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,0,0,.25) 1px, transparent 1px);
    background-size: 32px 32px;
    font-family: "Courier New", monospace; color: var(--paper);
    -webkit-font-smoothing: none;
  }
  h1, h2, h3, button, .tab { text-transform: uppercase; letter-spacing: 1px; }
  header {
    background: var(--grass); border-bottom: 6px solid var(--dirt);
    padding: 14px 18px; text-align: center;
  }
  header h1 { margin: 0; font-size: 22px; color: #fff; text-shadow: 2px 2px 0 var(--ink); }
  header p { margin: 4px 0 0; color: #e8ffd2; font-size: 12px; }
  nav { display: flex; justify-content: center; gap: 8px; padding: 12px; }
  .tab {
    background: var(--stone); color: #fff; border: 3px solid var(--ink);
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.25);
    padding: 8px 16px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  .tab.active { background: var(--grass-light); }
  main { max-width: 980px; margin: 0 auto; padding: 12px 16px 60px; }
  section { display: none; }
  section.active { display: block; }
  button.mc {
    background: var(--grass-light); color: #fff; border: 3px solid var(--ink);
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.3);
    padding: 10px 18px; font-family: inherit; font-weight: bold; font-size: 14px; cursor: pointer;
  }
  button.mc:disabled { filter: grayscale(.8); cursor: default; }
  button.mc.secondary { background: var(--dirt); }

  /* cards */
  .card {
    width: 210px; background: #efe6d5; color: var(--ink);
    border: 4px solid var(--ink); box-shadow: 6px 6px 0 rgba(0,0,0,.45);
    padding: 8px; position: relative;
  }
  .card .mob-face {
    font-size: 52px; text-align: center; padding: 12px 0;
    background: linear-gradient(#bfe3f7, #d9f0c8); border: 3px solid var(--ink);
  }
  .card h3 { margin: 6px 0 4px; font-size: 14px; text-align: center; }
  .card .tier { text-align: center; font-size: 10px; font-weight: bold; margin-bottom: 6px; }
  .tier.common { color: #6b6b6b; } .tier.uncommon { color: #3d8b3d; }
  .tier.rare { color: #2c6fb5; } .tier.epic { color: #8746c9; }
  .tier.legendary { color: #c9302c; text-shadow: 0 0 4px var(--gold); }
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    border: 2px solid var(--ink); margin-top: 3px; padding: 3px 6px;
    font-size: 12px; font-weight: bold; background: #fff;
  }
  .stat-row .val { min-width: 22px; text-align: right; }
  button.stat-row { width: 100%; font-family: inherit; cursor: pointer; }
  button.stat-row:hover:not(:disabled) { outline: 3px solid var(--gold); }
  button.stat-row:disabled { cursor: default; opacity: .9; }
  .stat-health { border-left: 8px solid var(--hp); } .stat-attack { border-left: 8px solid var(--atk); }
  .stat-size { border-left: 8px solid var(--siz); } .stat-speed { border-left: 8px solid var(--spd); }
  .stat-farmable { border-left: 8px solid var(--frm); } .stat-rarity { border-left: 8px solid var(--rar); }
  .stat-row.win { background: #cdeec2; outline: 3px solid #3d8b3d; }
  .stat-row.lose { background: #f3c8c8; outline: 3px solid #c9302c; }
  .stat-row.tied { background: #fbf0c4; outline: 3px solid #c9a227; }
  .card.back {
    background: var(--dirt-dark);
    display: flex; align-items: center; justify-content: center; min-height: 330px;
  }
  .card.back span { font-size: 64px; }

  /* battle layout */
  .hud { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
  .hud .chip {
    background: var(--ink); border: 3px solid var(--stone);
    padding: 6px 12px; font-size: 12px; font-weight: bold;
  }
  .arena { display: flex; gap: 24px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .side { text-align: center; }
  .side h2 { font-size: 14px; margin: 6px 0; }
  #battle-msg {
    text-align: center; font-size: 15px; font-weight: bold; margin: 14px auto; max-width: 640px;
    background: rgba(0,0,0,.5); border: 3px solid var(--stone); padding: 10px;
  }
  #battle-msg.player { border-color: var(--grass-light); color: #bdf29a; }
  #battle-msg.cpu { border-color: var(--hp); color: #ffb3b3; }
  #battle-msg.tie { border-color: var(--gold); color: var(--gold); }
  .controls { text-align: center; margin-top: 14px; }
  .setup { text-align: center; padding: 30px 0; }
  .setup label { font-size: 13px; margin-right: 8px; }
  .setup select {
    font-family: inherit; font-size: 14px; padding: 6px; border: 3px solid var(--ink);
    background: #efe6d5; margin-right: 12px;
  }

  /* collection + packs */
  .grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin-top: 14px; }
  .grid .card { width: 185px; }
  .grid .card .mob-face { font-size: 40px; padding: 8px 0; }
  #collection-tools { text-align: center; margin-top: 10px; }
  #collection-tools input, #collection-tools select {
    font-family: inherit; font-size: 13px; padding: 6px; border: 3px solid var(--ink);
    background: #efe6d5;
  }
  .pack-intro { text-align: center; padding: 24px 0 10px; }
  .pack-intro p { font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>⛏️ Mob Trumps</h1>
  <p>Minecraft creature card battles — Top Trumps rules</p>
</header>

<nav>
  <button class="tab active" data-tab="battle">⚔️ Battle</button>
  <button class="tab" data-tab="collection">📖 Collection</button>
  <button class="tab" data-tab="packs">🎁 Open Pack</button>
</nav>

<main>
  <section id="battle" class="active">
    <div id="battle-setup" class="setup">
      <label for="deck-size">Deck size:</label>
      <select id="deck-size">
        <option value="12">12 — quick raid</option>
        <option value="30" selected>30 — standard</option>
        <option value="50">50 — long haul</option>
        <option value="80">80 — every mob</option>
      </select>
      <button class="mc" id="start-battle">Start Battle</button>
    </div>

    <div id="battle-arena" style="display:none">
      <div class="hud">
        <span class="chip">🧍 You: <span id="hud-player">0</span></span>
        <span class="chip">Round <span id="hud-round">0</span></span>
        <span class="chip">🎴 Pot: <span id="hud-pot">0</span></span>
        <span class="chip">🤖 CPU: <span id="hud-cpu">0</span></span>
      </div>
      <div id="battle-msg">Pick a stat on your card to attack!</div>
      <div class="arena">
        <div class="side"><h2>🧍 Your card</h2><div id="player-card"></div></div>
        <div class="side"><h2>🤖 CPU card</h2><div id="cpu-card"></div></div>
      </div>
      <div class="controls">
        <button class="mc" id="next-btn" style="display:none"></button>
        <button class="mc secondary" id="quit-btn">New game</button>
      </div>
    </div>
  </section>

  <section id="collection">
    <div id="collection-tools">
      <input id="search" type="search" placeholder="Search mobs…">
      <select id="sort">
        <option value="name">Sort: Name</option>
        <option value="health">Sort: Health</option>
        <option value="attack">Sort: Attack</option>
        <option value="size">Sort: Size</option>
        <option value="speed">Sort: Speed</option>
        <option value="farmable">Sort: Farmable</option>
        <option value="rarity">Sort: Rarity</option>
      </select>
    </div>
    <div class="grid" id="collection-grid"></div>
  </section>

  <section id="packs">
    <div class="pack-intro">
      <p>Crack open a booster of 5 mob cards.<br>Common mobs spawn often — legendaries are one-in-a-blue-moon.</p>
      <button class="mc" id="open-pack">🎁 Open Pack</button>
    </div>
    <div class="grid" id="pack-grid"></div>
  </section>
</main>

<script>
const STATS = ["health", "attack", "size", "speed", "farmable", "rarity"];
const STAT_LABELS = { health: "❤️ Health", attack: "⚔️ Attack", size: "📏 Size",
                      speed: "💨 Speed", farmable: "🌾 Farmable", rarity: "✨ Rarity" };
const EMOJI = {
  "Allay":"🧚","Armadillo":"🦔","Axolotl":"🦎","Bat":"🦇","Bee":"🐝","Blaze":"🔥","Bogged":"🏹",
  "Breeze":"🌪️","Camel":"🐫","Cat":"🐱","Cave Spider":"🕷️","Chicken":"🐔","Cod":"🐟","Cow":"🐮",
  "Creaking":"🌲","Creeper":"🟩","Dolphin":"🐬","Donkey":"🫏","Drowned":"🧟","Elder Guardian":"🐡",
  "Ender Dragon":"🐉","Enderman":"🖤","Endermite":"🪲","Evoker":"🧙","Fox":"🦊","Frog":"🐸",
  "Ghast":"👻","Glow Squid":"🦑","Goat":"🐐","Guardian":"🐠","Hoglin":"🐗","Horse":"🐴","Husk":"🧟",
  "Iron Golem":"🤖","Llama":"🦙","Magma Cube":"🌋","Mooshroom":"🍄","Mule":"🐴","Ocelot":"🐆",
  "Panda":"🐼","Parrot":"🦜","Phantom":"🦅","Pig":"🐷","Piglin":"🐽","Piglin Brute":"🪓",
  "Pillager":"🏹","Polar Bear":"🐻‍❄️","Pufferfish":"🐡","Rabbit":"🐰","Ravager":"🐂","Salmon":"🐟",
  "Sheep":"🐑","Shulker":"📦","Silverfish":"🐛","Skeleton":"💀","Skeleton Horse":"🐎","Slime":"🟢",
  "Sniffer":"🦕","Snow Golem":"⛄","Spider":"🕸️","Squid":"🦑","Stray":"🧊","Strider":"🦶",
  "Sulfur Cube":"🟨","Tadpole":"🐌","Trader Llama":"🦙","Tropical Fish":"🐠","Turtle":"🐢",
  "Vex":"🗡️","Villager":"👨‍🌾","Vindicator":"🪓","Wandering Trader":"🎒","Warden":"📢","Witch":"🧪",
  "Wither":"☠️","Wither Skeleton":"🖤","Wolf":"🐺","Zombie":"🧟","Zombie Villager":"🧟",
  "Zombified Piglin":"🐷","Zoglin":"🐗"
};
const face = c => EMOJI[c.name] || "❓";

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}
const post = (path, body) => api(path, { method: "POST",
  headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
  document.querySelectorAll("main section").forEach(s =>
    s.classList.toggle("active", s.id === t.dataset.tab));
});

/* ---------- card rendering ---------- */
function cardHTML(card, { buttons = false, highlightStat = null, outcome = null } = {}) {
  const rows = STATS.map(s => {
    const cls = ["stat-row", "stat-" + s];
    if (highlightStat === s) cls.push(outcome);
    const inner = `<span>${STAT_LABELS[s]}</span><span class="val">${card[s]}</span>`;
    return buttons
      ? `<button class="${cls.join(" ")}" data-stat="${s}">${inner}</button>`
      : `<div class="${cls.join(" ")}">${inner}</div>`;
  }).join("");
  return `<div class="card">
    <div class="mob-face">${face(card)}</div>
    <h3>${card.name}</h3>
    <div class="tier ${card.tier}">★ ${card.tier} ★</div>
    ${rows}</div>`;
}
const cardBackHTML = `<div class="card back"><span>❔</span></div>`;

/* ---------- battle ---------- */
let game = null;

document.getElementById("start-battle").onclick = async () => {
  const deckSize = parseInt(document.getElementById("deck-size").value, 10);
  game = await post("/battles", { deck_size: deckSize });
  document.getElementById("battle-setup").style.display = "none";
  document.getElementById("battle-arena").style.display = "block";
  renderPreRound();
};
document.getElementById("quit-btn").onclick = () => {
  game = null;
  document.getElementById("battle-arena").style.display = "none";
  document.getElementById("battle-setup").style.display = "block";
};

function updateHUD() {
  document.getElementById("hud-player").textContent = game.player_deck_count;
  document.getElementById("hud-cpu").textContent = game.cpu_deck_count;
  document.getElementById("hud-pot").textContent = game.pot_count;
  document.getElementById("hud-round").textContent = game.round;
}
function setMsg(text, cls) {
  const el = document.getElementById("battle-msg");
  el.textContent = text;
  el.className = cls || "";
}

function renderPreRound() {
  updateHUD();
  const nextBtn = document.getElementById("next-btn");
  nextBtn.style.display = "none";
  if (game.finished) return renderGameOver();

  const myTurn = game.turn === "player";
  document.getElementById("player-card").innerHTML =
    cardHTML(game.player_card, { buttons: myTurn });
  document.getElementById("cpu-card").innerHTML = cardBackHTML;

  if (myTurn) {
    setMsg("Your pick — choose a stat to attack with!", "");
    document.querySelectorAll("#player-card button.stat-row").forEach(b =>
      b.onclick = () => playRound(b.dataset.stat));
  } else {
    setMsg("CPU's pick…", "");
    nextBtn.textContent = "See CPU's move";
    nextBtn.style.display = "inline-block";
    nextBtn.onclick = () => playRound(null);
  }
}

async function playRound(stat) {
  game = await post(`/battles/${game.id}/play`, stat ? { stat } : {});
  const lr = game.last_round;
  const outcomeFor = side => lr.result === "tie" ? "tied" : lr.result === side ? "win" : "lose";
  document.getElementById("player-card").innerHTML =
    cardHTML(lr.player_card, { highlightStat: lr.stat, outcome: outcomeFor("player") });
  document.getElementById("cpu-card").innerHTML =
    cardHTML(lr.cpu_card, { highlightStat: lr.stat, outcome: outcomeFor("cpu") });

  const label = STAT_LABELS[lr.stat];
  if (lr.result === "player")
    setMsg(`You win the round! ${label}: ${lr.player_card[lr.stat]} beats ${lr.cpu_card[lr.stat]}.`, "player");
  else if (lr.result === "cpu")
    setMsg(`CPU takes it. ${label}: ${lr.cpu_card[lr.stat]} beats ${lr.player_card[lr.stat]}.`, "cpu");
  else
    setMsg(`Tie on ${label} (${lr.player_card[lr.stat]}). Cards go to the pot!`, "tie");

  updateHUD();
  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = game.finished ? "See result" : "Next round ▶";
  nextBtn.style.display = "inline-block";
  nextBtn.onclick = renderPreRound;
}

function renderGameOver() {
  const msgs = {
    player: "🏆 VICTORY! You collected every card!",
    cpu: "💀 DEFEAT! The CPU took your whole deck…",
    draw: "🤝 It's a draw — the pot swallowed everything."
  };
  setMsg(msgs[game.winner],
    game.winner === "player" ? "player" : game.winner === "cpu" ? "cpu" : "tie");
  document.getElementById("player-card").innerHTML = "";
  document.getElementById("cpu-card").innerHTML = "";
  document.getElementById("next-btn").style.display = "none";
}

/* ---------- collection ---------- */
let allCards = [];
async function renderCollection() {
  if (!allCards.length) allCards = await api("/cards");
  const q = document.getElementById("search").value.trim().toLowerCase();
  const key = document.getElementById("sort").value;
  let cardsToShow = allCards.filter(c => c.name.toLowerCase().includes(q));
  cardsToShow.sort((a, b) => key === "name"
    ? a.name.localeCompare(b.name)
    : b[key] - a[key] || a.name.localeCompare(b.name));
  document.getElementById("collection-grid").innerHTML =
    cardsToShow.map(c => cardHTML(c)).join("");
}
document.getElementById("search").oninput = renderCollection;
document.getElementById("sort").onchange = renderCollection;
renderCollection();

/* ---------- packs ---------- */
document.getElementById("open-pack").onclick = async () => {
  const pulls = await post("/packs/open?size=5");
  document.getElementById("pack-grid").innerHTML = pulls.map(c => cardHTML(c)).join("");
};
</script>
</body>
</html>
